name: deployment-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n install.sh uninstall.sh install_mtproxy.sh uninstall_mtproxy.sh scripts/check-deployment.sh docker/telemt-entrypoint.sh panel/entrypoint.sh
          shellcheck install.sh uninstall.sh install_mtproxy.sh uninstall_mtproxy.sh scripts/check-deployment.sh docker/telemt-entrypoint.sh panel/entrypoint.sh
      - name: Python tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r panel/requirements-dev.txt
          .venv/bin/ruff check .
          .venv/bin/python -m pytest -q panel/tests tests/test_naive_manager.py
          python3 -m unittest -v tests/test_deploy.py
      - name: Compose render
        run: |
          cat > .env <<'EOF'
          MTPROXY_DOMAIN=proxy.example.com
          MTPROXY_BACKEND_PORT=18445
          MTPROXY_COVER_ROOT=/tmp/cover
          MTPROXY_LETSENCRYPT_ROOT=/tmp/letsencrypt
          EOF
          mkdir -p secrets
          printf 'ci=0123456789abcdef0123456789abcdef\n' > secrets/users.conf
          printf 'Bearer ci-internal-token-0123456789abcdef0123456789abcdef\n' > secrets/telemt-api-token
          docker compose config -q
          printf 'ci-naive-manager-token-0123456789abcdef0123456789abcdef\n' > secrets/naive-manager-token
          docker compose -f compose.yaml -f compose.naive.yaml config -q
          docker compose -f compose.yaml -f compose.naive.yaml build panel naive-manager
      - name: Diff hygiene
        run: git diff --check
