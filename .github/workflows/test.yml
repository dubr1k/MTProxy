name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r panel/requirements-dev.txt
      - name: Ruff and full tests
        run: |
          .venv/bin/ruff check .
          .venv/bin/python -m pytest -q
          .venv/bin/python -m unittest -v tests/test_deploy.py
      - name: Every tracked shell script
        run: |
          mapfile -d '' -t shell_files < <(git ls-files -z '*.sh')
          test "${#shell_files[@]}" -gt 0
          printf '%s\n' "${shell_files[@]}"
          for script in "${shell_files[@]}"; do
            bash -n "$script"
          done
          shellcheck "${shell_files[@]}"
      - name: Documentation, notices, service units, and diff hygiene
        run: |
          .venv/bin/python scripts/check-doc-links.py
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          grep -q 'Mieru/mita' THIRD_PARTY_NOTICES.md
          grep -q 'not bundled' THIRD_PARTY_NOTICES.md
          grep -Fq 'caddy:2.11.4-builder@sha256:c7ae80243a530d532d20062d56d6198b3ab161eb6971d28716ef7ec55599fea4' docker/Dockerfile.caddy-naive
          grep -Fq 'github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@d62c80d3dd2c706b6b87579844d2397bddd18317' docker/Dockerfile.caddy-naive
          sudo install -d /usr/local/libexec /opt/proxy-control/venv/bin /opt/mtproxy-agent/venv/bin /opt/mtproxy-panel/venv/bin
          sudo install -m 0755 /bin/true /usr/local/libexec/check-naive-caddy-build
          sudo install -m 0755 /bin/true /usr/local/bin/caddy
          sudo install -m 0755 /bin/true /opt/proxy-control/venv/bin/python
          sudo install -m 0755 /bin/true /opt/mtproxy-agent/venv/bin/python
          sudo install -m 0755 /bin/true /opt/mtproxy-panel/venv/bin/python
          printf '[Unit]\nDescription=CI stub mita dependency\n[Service]\nType=oneshot\nExecStart=/bin/true\n' | sudo tee /etc/systemd/system/mita.service >/dev/null
          systemd-analyze verify deploy/*.service
          git diff --check

  compose-and-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare synthetic render inputs
        run: |
          cat > .env <<'EOF'
          MTPROXY_DOMAIN=proxy.example.com
          MTPROXY_BACKEND_PORT=18445
          MTPROXY_COVER_ROOT=/tmp/cover
          MTPROXY_LETSENCRYPT_ROOT=/tmp/letsencrypt
          NAIVE_PUBLIC_HOST=naive.example.com
          EOF
          mkdir -p secrets
          printf 'ci=0123456789abcdef0123456789abcdef\n' > secrets/users.conf
          printf 'Bearer ci-internal-token-0123456789abcdef0123456789abcdef\n' > secrets/telemt-api-token
          printf 'ci-naive-manager-token-0123456789abcdef0123456789abcdef\n' > secrets/naive-manager-token
          printf 'ci-mieru-manager-token-0123456789abcdef0123456789abcdef\n' > secrets/mieru-manager-token
          printf 'MIERU_MANAGER_TOKEN_FILE=%s\n' "$PWD/secrets/mieru-manager-token" >> .env
      - name: Render every Compose model
        run: |
          docker compose -f compose.yaml config -q
          NAIVE_PUBLIC_HOST=naive.example.com docker compose -f compose.yaml -f compose.naive.yaml config -q
          MIERU_PUBLIC_HOST=mieru.example.com MIERU_MITA_GID=321 MIERU_MITA_BIN=/bin/true MIERU_MITA_SHA256=4aa03abde846548692dc479359fd9d6c378c0b0e3ab22f94b2c22b1e54dcdb31 docker compose -f compose.yaml -f compose.mieru.yaml config -q
          NAIVE_PUBLIC_HOST=naive.example.com MIERU_PUBLIC_HOST=mieru.example.com MIERU_MITA_GID=321 MIERU_MITA_BIN=/bin/true MIERU_MITA_SHA256=4aa03abde846548692dc479359fd9d6c378c0b0e3ab22f94b2c22b1e54dcdb31 docker compose -f compose.yaml -f compose.naive.yaml -f compose.mieru.yaml config -q
          FLEET_NODE_ID=node-ci FLEET_CENTRAL_URL=https://fleet.example.com:8790 FLEET_CLIENT_CERT=/tmp/client.crt FLEET_CLIENT_KEY=/tmp/client.key TELEMT_API_TOKEN_FILE="$PWD/secrets/telemt-api-token" docker compose -f compose.agent.yaml config -q
          FLEET_SERVER_CERT=/tmp/server.crt FLEET_SERVER_KEY=/tmp/server.key FLEET_CLIENT_CA=/tmp/client-ca.crt docker compose -f compose.fleet-central.yaml config -q
      - name: Render documented Mieru quickstart without secret contents
        run: |
          mkdir -p "$RUNNER_TEMP/mieru-render/state"
          : > "$RUNNER_TEMP/mieru-render/token"
          install -m 0755 /bin/true "$RUNNER_TEMP/mieru-render/mita"
          MTPROXY_DOMAIN=proxy.example.com \
          MTPROXY_BACKEND_PORT=18445 \
          MTPROXY_COVER_ROOT="$RUNNER_TEMP/mieru-render/cover" \
          MTPROXY_LETSENCRYPT_ROOT="$RUNNER_TEMP/mieru-render/letsencrypt" \
          MIERU_PUBLIC_HOST=mieru.example.com \
          MIERU_MITA_BIN="$RUNNER_TEMP/mieru-render/mita" \
          MIERU_MITA_SHA256=4aa03abde846548692dc479359fd9d6c378c0b0e3ab22f94b2c22b1e54dcdb31 \
          MIERU_MITA_GID=321 \
          MIERU_MANAGER_STATE_DIR="$RUNNER_TEMP/mieru-render/state" \
          MIERU_MANAGER_TOKEN_FILE="$RUNNER_TEMP/mieru-render/token" \
          docker compose --env-file /dev/null -f compose.yaml -f compose.mieru.yaml config -q
      - name: Build project images
        run: |
          NAIVE_PUBLIC_HOST=naive.example.com docker compose -f compose.yaml -f compose.naive.yaml build panel naive-manager
          MIERU_PUBLIC_HOST=mieru.example.com MIERU_MITA_GID=321 MIERU_MITA_BIN=/bin/true MIERU_MITA_SHA256=4aa03abde846548692dc479359fd9d6c378c0b0e3ab22f94b2c22b1e54dcdb31 docker compose -f compose.yaml -f compose.mieru.yaml build mieru-manager
          NAIVE_PUBLIC_HOST=naive.example.com MIERU_PUBLIC_HOST=mieru.example.com MIERU_MITA_GID=321 MIERU_MITA_BIN=/bin/true MIERU_MITA_SHA256=4aa03abde846548692dc479359fd9d6c378c0b0e3ab22f94b2c22b1e54dcdb31 docker compose -f compose.yaml -f compose.naive.yaml -f compose.mieru.yaml build panel naive-manager mieru-manager
          docker build -f deploy/Dockerfile.agent -t proxy-control-agent:test .
          docker build -f deploy/Dockerfile.ingress -t proxy-control-ingress:test .
          test "$(docker run --rm --entrypoint id proxy-control-ingress:test -u)" = 10001
          test "$(docker run --rm --entrypoint id proxy-control-ingress:test -g)" = 10001
      - name: Build and validate pinned Caddy
        run: |
          mkdir -p "$RUNNER_TEMP/caddy-naive"
          timeout 10m docker buildx build \
            --file docker/Dockerfile.caddy-naive \
            --output "type=local,dest=$RUNNER_TEMP/caddy-naive" .
          timeout 10s env CADDY_BIN="$RUNNER_TEMP/caddy-naive/caddy" \
            scripts/check-naive-caddy-build.sh
          if timeout 10s env CADDY_BIN=/bin/true scripts/check-naive-caddy-build.sh \
            2>"$RUNNER_TEMP/caddy-negative.log"; then
            echo 'checker accepted a non-Caddy executable' >&2
            exit 1
          fi
          grep -Fq 'refusing unpinned Caddy build' "$RUNNER_TEMP/caddy-negative.log"
