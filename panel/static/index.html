<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTProxy Panel</title><link rel="stylesheet" href="/static/style.css"></head>
<body><aside class="sidebar"><div class="brand"><b>M</b> MTProxy</div><nav aria-label="Основная навигация"><button data-view="dashboard">Обзор</button><button data-view="users">Пользователи</button><button data-view="admins">Администраторы</button><button data-view="audit">Аудит</button></nav></aside>
<main class="content"><header><div><span class="eyebrow">CONTROL PLANE</span><h1 id="title">Обзор</h1></div><button id="add" hidden>Добавить</button></header><section id="view" aria-live="polite"><div class="cards"><article><small>Состояние</small><strong>Загрузка…</strong></article></div></section></main>
<nav class="mobile-nav" aria-label="Мобильная навигация"><button data-view="dashboard">Обзор</button><button data-view="users">Люди</button><button data-view="admins">Админы</button><button data-view="audit">Аудит</button></nav>
<dialog id="user-modal"><form method="dialog"><button class="close">×</button><h2>Новый пользователь</h2><label>Имя<input id="new-user" pattern="[A-Za-z0-9.-]+" maxlength="32" required></label><button id="create-user" type="button">Создать</button></form></dialog>
<dialog id="admin-modal"><form method="dialog"><button class="close">×</button><h2>Администратор</h2><input id="admin-id" type="hidden"><label>Логин<input id="admin-user" pattern="[A-Za-z0-9_.-]+" maxlength="64"></label><label>Пароль<input id="admin-password" type="password" minlength="12" autocomplete="new-password"></label><label>Роль<select id="admin-role"><option value="viewer">Viewer</option><option value="admin">Admin</option><option value="owner">Owner</option></select></label><button id="save-admin" type="button">Сохранить</button></form></dialog>
<dialog id="confirm"><form method="dialog"><h2 id="confirm-title">Подтверждение</h2><p id="confirm-text"></p><button value="cancel">Отмена</button><button id="confirm-ok" value="default">Продолжить</button></form></dialog>
<dialog id="reveal"><form method="dialog"><h2>Сохраните сейчас</h2><p>Секрет и ссылка больше не будут показаны.</p><code id="secret"></code><button id="copy" type="button">Копировать</button><canvas id="qr-canvas" width="220" height="220" aria-label="QR-код"></canvas><button>Готово</button></form></dialog>
<script src="/static/app.js"></script></body></html>
