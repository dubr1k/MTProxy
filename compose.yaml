name: mtproxy

services:
  mask:
    container_name: proxy-control-mask
    init: true
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      MTPROXY_DOMAIN: ${MTPROXY_DOMAIN}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config
      - /data
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MTPROXY_LETSENCRYPT_ROOT:-/etc/letsencrypt}:/etc/letsencrypt:ro
      # Cover-site content is intentionally stored outside Git.
      - ${MTPROXY_COVER_ROOT}:/srv/tga:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate --header='Host: ${MTPROXY_DOMAIN}' --spider https://${MTPROXY_DOMAIN}:443/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      default:
        aliases:
          - ${MTPROXY_DOMAIN}

  mtproxy:
    container_name: proxy-control-mtproxy
    image: ghcr.io/samnet-dev/mtproxymax-telemt@sha256:ab27edbceb9f8c042911a7d9a44835318d1db5943ff50f276792fa29601ff856
    entrypoint: ["/usr/local/bin/telemt-entrypoint.sh"]
    restart: unless-stopped
    depends_on:
      mask:
        condition: service_healthy
    environment:
      FAKE_TLS_DOMAIN: ${MTPROXY_DOMAIN}
      SECRETS_FILE: /run/secrets/mtproxy-secrets
      API_TOKEN_FILE: /run/secrets/telemt-api-token
    secrets:
      - mtproxy-secrets
      - telemt-api-token
    ports:
      - "127.0.0.1:${MTPROXY_BACKEND_PORT}:443/tcp"
    read_only: true
    volumes:
      - ./docker/telemt-entrypoint.sh:/usr/local/bin/telemt-entrypoint.sh:ro
      - telemt-config:/var/lib/telemt
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/net/tcp && grep -qi ':01BB ' /proc/net/tcp"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  panel:
    container_name: proxy-control-panel
    build:
      context: ./panel
    restart: unless-stopped
    depends_on:
      mtproxy:
        condition: service_healthy
    environment:
      PANEL_DATABASE: /data/panel.sqlite3
      PANEL_ALLOWED_HOSTS: ${PANEL_ALLOWED_HOSTS:-localhost,127.0.0.1}
      PANEL_HEALTHCHECK_HOST: ${PANEL_HEALTHCHECK_HOST:-localhost}
      PANEL_COOKIE_SECURE: ${PANEL_COOKIE_SECURE:-true}
      TELEMT_API_URL: http://mtproxy:9091
      TELEMT_API_TOKEN_SOURCE: /run/secrets/telemt-api-token
      VERSION_AGENT_SOCKET: /run/proxy-control/version-agent.sock
    secrets:
      - telemt-api-token
    ports:
      - "127.0.0.1:8787:8787/tcp"
    volumes:
      - panel-data:/data
      - /run/proxy-control:/run/proxy-control
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700
      - /run/panel:size=1m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8787;
          printf 'GET /healthz HTTP/1.0\r\nHost: %s\r\nConnection: close\r\n\r\n' "$${PANEL_HEALTHCHECK_HOST}" >&3;
          IFS=' ' read -r -t 5 protocol status_code reason <&3;
          [[ "$$protocol" == HTTP/* && "$$status_code" == 200 ]]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s

secrets:
  mtproxy-secrets:
    file: ./secrets/users.conf
  telemt-api-token:
    file: ./secrets/telemt-api-token

volumes:
  telemt-config:
  panel-data:
