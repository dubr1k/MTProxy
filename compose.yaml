name: mtproxy

services:
  mask:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      MTPROXY_DOMAIN: ${MTPROXY_DOMAIN}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config
      - /data
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MTPROXY_LETSENCRYPT_ROOT:-/etc/letsencrypt}:/etc/letsencrypt:ro
      # Cover-site content is intentionally stored outside Git.
      - ${MTPROXY_COVER_ROOT}:/srv/tga:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate --header='Host: ${MTPROXY_DOMAIN}' --spider https://${MTPROXY_DOMAIN}:443/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      default:
        aliases:
          - ${MTPROXY_DOMAIN}

  mtproxy:
    image: ghcr.io/samnet-dev/mtproxymax-telemt@sha256:ab27edbceb9f8c042911a7d9a44835318d1db5943ff50f276792fa29601ff856
    container_name: mtproxy
    entrypoint: ["/usr/local/bin/telemt-entrypoint.sh"]
    restart: unless-stopped
    depends_on:
      mask:
        condition: service_healthy
    environment:
      FAKE_TLS_DOMAIN: ${MTPROXY_DOMAIN}
      SECRETS_FILE: /run/secrets/mtproxy-secrets
    secrets:
      - mtproxy-secrets
    ports:
      - "127.0.0.1:${MTPROXY_BACKEND_PORT}:443/tcp"
    read_only: true
    volumes:
      - ./docker/telemt-entrypoint.sh:/usr/local/bin/telemt-entrypoint.sh:ro
    tmpfs:
      - /run/telemt:size=32m,mode=0700
    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/net/tcp && grep -qi ':01BB ' /proc/net/tcp"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

secrets:
  mtproxy-secrets:
    file: ./secrets/users.conf
