name: mtproxy

services:
  fleet-agent:
    container_name: proxy-control-fleet-agent
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    restart: unless-stopped
    depends_on:
      mtproxy:
        condition: service_healthy
    environment:
      FLEET_NODE_ID: ${FLEET_NODE_ID:?required}
      FLEET_CENTRAL_URL: ${FLEET_CENTRAL_URL:?required}
      FLEET_CLIENT_CERT: /run/fleet/client.crt
      FLEET_CLIENT_KEY: /run/fleet/client.key
      TELEMT_API_URL: http://mtproxy:9091
      TELEMT_API_TOKEN_FILE: /run/secrets/telemt-api-token
      FLEET_JOURNAL: /data/journal.sqlite3
    secrets:
      - telemt-api-token
    volumes:
      - ${FLEET_CLIENT_CERT:?required}:/run/fleet/client.crt:ro
      - ${FLEET_CLIENT_KEY:?required}:/run/fleet/client.key:ro
      - fleet-agent-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  fleet-agent-data:
